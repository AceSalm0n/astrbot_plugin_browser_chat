name: astrbot_plugin_browser_chat
display_name: Browser Chat 网页对话
desc: 无需 API 密钥，在 QQ 畅聊 ChatGPT 或 DeepSeek 网页版；使用免费账号即可接入，额度以网站规则为准。
version: 0.1.0
author: AceSalm0n
repo: https://github.com/AceSalm0n/astrbot_plugin_browser_chat
support_platforms:
  - aiocqhttp
help: |
  /ask ai 问题 - 文字问答，可直接引用文字消息
  /ask cancel - 取消自己的未完成任务，不撤回已提交消息
  /ask status - 管理员查看状态
  /ask pause - 管理员暂停接单并等待任务退出
  /ask resume - 管理员重新核验网页状态
  /ask resume 已核验 - 兼容旧命令，行为与 /ask resume 相同
  /ask cleanup check 任务ID - 管理员只读核查单个会话
  /ask cleanup retry 任务ID - 管理员重试尚未尝试删除的会话
  /ask cleanup resolve 任务ID 已核对 - 管理员登记人工确认，不执行删除
