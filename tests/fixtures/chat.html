<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local Chat Fixture</title>
<style>body { font: 16px sans-serif; max-width: 900px; margin: 20px auto } [hidden] { display:none !important } .markdown { white-space:pre-wrap } #prompt-textarea { border:1px solid; min-height:60px; padding:8px } nav a { display:block }</style>
<header>
  <a aria-label="New chat" id="new-chat" href="/">New chat</a>
  <button data-testid="accounts-profile-button">Fixture account</button>
</header>
<nav aria-label="History"></nav>
<main>
  <div id="messages"></div>
  <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Message ChatGPT"></div>
  <button data-testid="send-button">Send</button>
  <button data-testid="stop-button" hidden>Stop generating</button>
  <button aria-label="Conversation options" hidden>Options</button>
  <button role="menuitem" hidden>Delete</button>
  <dialog aria-label="Delete chat"><p>Delete this chat?</p><button>Delete</button></dialog>
  <div role="alert" hidden></div>
  <div role="status" hidden></div>
</main>
<footer>Submissions: <output id="submission-count"></output>; Deleted: <output id="deleted-ids"></output></footer>
<script>
const initialScenario = __SCENARIO_JSON__;
const read = key => JSON.parse(localStorage.getItem(key) || '{}');
let sessions = read('fixture-sessions');
let activeId = location.pathname.startsWith('/c/') ? location.pathname.slice(3) : null;
let scenario = activeId && sessions[activeId] ? sessions[activeId].scenario : initialScenario;
const messages = document.querySelector('#messages');
const alertBox = document.querySelector('[role=alert]');
const stop = document.querySelector('[data-testid=stop-button]');
const options = document.querySelector('[aria-label="Conversation options"]');
const item = document.querySelector('[role=menuitem]');
const dialog = document.querySelector('dialog');
const count = () => document.querySelector('#submission-count').textContent = localStorage.getItem('fixture-count') || '0';
const history = () => {
  const nav = document.querySelector('nav'); nav.replaceChildren();
  for (const id of Object.keys(sessions)) {
    const a = document.createElement('a'); a.href='/c/'+id; a.textContent='Conversation '+id; nav.append(a);
  }
  document.querySelector('#deleted-ids').textContent=localStorage.getItem('fixture-deleted') || '';
};
function error(text) { alertBox.textContent=text; alertBox.hidden=false; }
function message(role, text) {
  const root=document.createElement('div'); root.dataset.messageAuthorRole=role;
  const body=document.createElement('div'); body.className='markdown'; body.textContent=text;
  root.append(body); messages.append(root); return root;
}
function complete(root, text) {
  if (text !== undefined) root.querySelector('.markdown').textContent=text;
  stop.hidden=true;
  if (scenario !== 'missing_completion') {
    const copy=document.createElement('button'); copy.dataset.testid='copy-turn-action-button'; copy.textContent='Copy'; root.append(copy);
  }
  if (activeId && sessions[activeId]) {
    sessions[activeId].answer=root.querySelector('.markdown').textContent;
    localStorage.setItem('fixture-sessions',JSON.stringify(sessions));
  }
}
function initial() {
  if (activeId && sessions[activeId]) {
    message('user',sessions[activeId].prompt);
    complete(message('assistant',sessions[activeId].answer || 'Fixture answer'));
    options.hidden=false;
  }
  if (scenario === 'old_answer') complete(message('assistant','OLD ANSWER MUST NEVER RETURN'));
  if (scenario === 'login') {
    document.querySelector('[data-testid=accounts-profile-button]').remove();
    document.querySelector('#prompt-textarea').remove();
    const login=document.createElement('button'); login.textContent='Log in'; document.querySelector('main').append(login);
  }
  if (scenario === 'challenge') {
    document.title='Just a moment...'; error('Verify you are human');
  }
  if (scenario === 'unsupported_region') error('Services not available in your country');
  if (scenario === 'changed') document.querySelector('#prompt-textarea').id='changed-composer';
  count(); history();
}
document.querySelector('#new-chat').addEventListener('click', e => {
  e.preventDefault(); activeId=null; window.history.replaceState({},'', '/');
  messages.replaceChildren(); options.hidden=true;
  if (scenario === 'old_answer') complete(message('assistant','OLD ANSWER MUST NEVER RETURN'));
});
document.querySelector('[data-testid=send-button]').addEventListener('click', () => {
  const prompt=document.querySelector('#prompt-textarea').innerText;
  localStorage.setItem('fixture-count', String(Number(localStorage.getItem('fixture-count') || 0)+1)); count();
  if (scenario === 'unconfirmed') return;
  if (scenario === 'submit_error') { error('Something went wrong'); return; }
  message('user',prompt);
  if (scenario !== 'unknown_id') {
    activeId=crypto.randomUUID();
    sessions[activeId]={scenario,prompt,answer:''};
    localStorage.setItem('fixture-sessions',JSON.stringify(sessions));
    window.history.replaceState({},'', '/c/'+activeId); options.hidden=false; history();
  }
  if (scenario === 'mismatched_user') messages.querySelector('[data-message-author-role=user] .markdown').textContent='A different question';
  if (scenario === 'unconfirmed_with_id') {
    messages.querySelector('[data-message-author-role=user]').remove(); return;
  }
  if (scenario === 'rate_limit') { error('Too many requests'); return; }
  if (scenario === 'web_error') { error('Something went wrong'); return; }
  if (scenario === 'login_expired') {
    document.querySelector('[data-testid=accounts-profile-button]').remove();
    const login=document.createElement('button'); login.textContent='Log in'; document.querySelector('main').append(login); return;
  }
  if (scenario === 'old_answer') return;
  const root=message('assistant',''); stop.hidden=false;
  if (scenario === 'empty') { setTimeout(()=>complete(root,''),25); return; }
  if (scenario === 'forever') { root.querySelector('.markdown').textContent='stable but still generating'; return; }
  if (scenario === 'structure_after_submit') { root.querySelector('.markdown').remove(); stop.hidden=true; return; }
  if (scenario === 'long_pause') {
    root.querySelector('.markdown').textContent='prefix';
    setTimeout(()=>complete(root,'prefix then final content'),220); return;
  }
  if (scenario === 'long_prefix') {
    root.querySelector('.markdown').textContent='x'.repeat(13000);
    setTimeout(()=>complete(root,'x'.repeat(13000)+' FINAL TAIL'),180); return;
  }
  if (scenario === 'code_links') {
    setTimeout(()=>{
      root.querySelector('.markdown').textContent='```python\nprint("fixture")\n```\nSource';
      const link=document.createElement('a'); link.href='https://example.com/reference'; link.textContent='Reference'; root.querySelector('.markdown').append(link);
      complete(root);
    },30); return;
  }
  setTimeout(()=>root.querySelector('.markdown').textContent='first chunk',20);
  setTimeout(()=>complete(root,scenario === 'echo' ? 'Reply: '+prompt : 'Fixture final answer'),60);
});
options.addEventListener('click',()=>item.hidden=false);
item.addEventListener('click',()=>dialog.showModal());
dialog.querySelector('button').addEventListener('click',()=>{
  dialog.close();
  if (scenario === 'delete_failure') { error('Deletion failed'); return; }
  if (scenario === 'delete_unknown') {
    activeId=null; window.history.replaceState({},'', '/'); messages.replaceChildren(); return;
  }
  const deleted=activeId;
  if (deleted && sessions[deleted]) {
    delete sessions[deleted]; localStorage.setItem('fixture-sessions',JSON.stringify(sessions));
    localStorage.setItem('fixture-deleted',(localStorage.getItem('fixture-deleted') || '')+' '+deleted);
  }
  activeId=null; window.history.replaceState({},'', '/'); messages.replaceChildren(); options.hidden=true; history();
  const status=document.querySelector('[role=status]'); status.textContent='Chat deleted'; status.hidden=false;
});
initial();
</script>
</html>
